# 최소 로컬 DB 구성 — 실제 클라우드 Firestore/서비스 계정 키 없이
# meetings 컬렉션 읽기/쓰기를 로컬에서 검증하기 위한 Firestore 에뮬레이터.
#
# 목적: extraction.py(LLM 체인)가 아직 미구현이거나, 반복 테스트로
# OpenAI 토큰을 쓰고 싶지 않을 때도 DB 저장/조회 로직만 따로 검증할 수
# 있게 하기 위함 — app/tests/test_meetings_with_emulator.py 참고.
#
# 사용법: docker compose up -d  →  .env에 FIRESTORE_EMULATOR_HOST=localhost:8080 추가
services:
  firestore-emulator:
    image: google/cloud-sdk:emulators
    command: >
      gcloud emulators firestore start
      --host-port=0.0.0.0:8080
      --project=demo-meeting-stt
    ports:
      - "8080:8080"
