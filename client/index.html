<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회의록 STT 요약</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>회의록 STT 요약</h1>
    <nav>
      <a href="index.html" aria-current="page">새 회의록</a>
      <a href="list.html">회의 목록</a>
    </nav>
  </header>

  <main>
    <section class="panel">
      <label for="raw-text">STT 텍스트 붙여넣기</label>
      <textarea id="raw-text" rows="14" maxlength="20000" placeholder="회의 녹취 텍스트를 붙여넣으세요."></textarea>
      <div class="field-footer">
        <span id="char-count" class="char-count">0 / 20,000자</span>
        <button id="extract-btn" type="button">추출 및 저장</button>
      </div>
      <p id="status" role="status"></p>
    </section>

    <section id="result" class="panel" hidden>
      <h2 id="result-title"></h2>
      <div class="meeting-meta">
        <span id="result-date"></span>
        <span id="result-status-badge"></span>
      </div>

      <h3>결정사항</h3>
      <ul id="result-decisions" class="decisions-list"></ul>

      <h3>액션아이템</h3>
      <div class="table-scroll">
        <table>
          <caption class="visually-hidden">이 회의의 액션아이템: 할 일, 담당자, 기한</caption>
          <thead>
            <tr><th scope="col">할 일</th><th scope="col">담당자</th><th scope="col">기한</th></tr>
          </thead>
          <tbody id="result-action-items"></tbody>
        </table>
      </div>

      <a id="result-link" class="back-link" href="#">회의 목록에서 보기 &rarr;</a>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/render.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
