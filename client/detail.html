<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회의 상세 — 회의록 STT 요약</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>회의 상세</h1>
    <nav>
      <a href="index.html">새 회의록</a>
      <a href="list.html" aria-current="page">회의 목록</a>
    </nav>
  </header>

  <main>
    <a class="back-link" href="list.html">&larr; 회의 목록으로</a>
    <p id="status" role="status"></p>
    <article id="meeting-detail" class="panel" hidden>
      <h2 id="meeting-title"></h2>
      <div class="meeting-meta">
        <span id="meeting-date"></span>
        <span id="meeting-status-badge"></span>
      </div>

      <h3>결정사항</h3>
      <ul id="meeting-decisions" class="decisions-list"></ul>

      <h3>액션아이템</h3>
      <div class="table-scroll">
        <table>
          <caption class="visually-hidden">이 회의의 액션아이템: 할 일, 담당자, 기한</caption>
          <thead>
            <tr><th scope="col">할 일</th><th scope="col">담당자</th><th scope="col">기한</th></tr>
          </thead>
          <tbody id="meeting-action-items"></tbody>
        </table>
      </div>
    </article>
  </main>

  <script src="js/api.js"></script>
  <script src="js/render.js"></script>
  <script src="js/detail.js"></script>
</body>
</html>
